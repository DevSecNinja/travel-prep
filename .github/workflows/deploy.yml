name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Stamp build id (busts the service-worker cache on every commit)
        run: |
          BUILD_ID="${GITHUB_SHA::12}-$(date -u +%Y%m%d%H%M%S)"
          echo "Stamping BUILD_ID=$BUILD_ID"
          # Replace the __BUILD_ID__ placeholder in source files we ship.
          sed -i "s/__BUILD_ID__/$BUILD_ID/g" service-worker.js src/main.js

      - name: Assemble site directory
        run: |
          mkdir -p _site
          cp -r index.html styles.css manifest.webmanifest service-worker.js src data icons _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
